services:
  postgres:
    image: postgres:16-alpine
    container_name: reservio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reservio}
      POSTGRES_USER: ${POSTGRES_USER:-reservio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reservio-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-reservio}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-reservio}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID}
      LINE_LOGIN_CHANNEL_SECRET: ${LINE_LOGIN_CHANNEL_SECRET}
      LINE_CREDENTIAL_ENCRYPTION_KEY: ${LINE_CREDENTIAL_ENCRYPTION_KEY:?LINE_CREDENTIAL_ENCRYPTION_KEY is required}
      LINE_WEBHOOK_BASE_URL: ${LINE_WEBHOOK_BASE_URL:-https://www.reserv-io.com}
      LINE_WORKER_DELAY_MS: ${LINE_WORKER_DELAY_MS:-1000}
      LINE_RATE_LIMIT_PER_MINUTE: ${LINE_RATE_LIMIT_PER_MINUTE:-20}
      LINE_RATE_LIMIT_WINDOW_SECONDS: ${LINE_RATE_LIMIT_WINDOW_SECONDS:-60}
      LINE_EVENT_RETENTION_DAYS: ${LINE_EVENT_RETENTION_DAYS:-30}
      LINE_CONVERSATION_RETENTION_DAYS: ${LINE_CONVERSATION_RETENTION_DAYS:-14}
      LINE_CLEANUP_CRON: "${LINE_CLEANUP_CRON:-0 30 3 * * *}"
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-noreply@reserv-io.com}
      APP_MAIL_REPLY_TO: ${APP_MAIL_REPLY_TO:-support@reserv-io.com}
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reservio-frontend
    restart: unless-stopped
    expose:
      - "80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: reservio-cloudflared
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  postgres-data:
