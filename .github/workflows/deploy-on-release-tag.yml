name: Deploy on Release Tag

on:
  push:
    tags:
      - 'release-v*'

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy on Windows Runner
    runs-on: [self-hosted, windows, reservio-deploy]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare deploy request for scheduled task
        shell: powershell
        run: |
          $repoPath = 'C:\Users\dist6\reservio'
          $tagFile = Join-Path $repoPath '.deploy-tag'

          if (!(Test-Path $repoPath)) {
            throw "Deploy path not found: $repoPath"
          }

          Set-Content -Path $tagFile -Value $env:GITHUB_REF_NAME -Encoding ASCII
          Write-Host "Prepared deploy tag file: $tagFile"

      - name: Trigger scheduled deployment task
        shell: powershell
        run: |
          $taskName = 'ReservioDeploy'
          schtasks /Run /TN $taskName
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to trigger scheduled task '$taskName'. Create it first in Windows Task Scheduler."
          }

      - name: Wait for deployment task to finish
        shell: powershell
        run: |
          $taskName = 'ReservioDeploy'
          $maxWaitSeconds = 900
          $elapsed = 0

          while ($elapsed -lt $maxWaitSeconds) {
            $state = (schtasks /Query /TN $taskName /FO LIST /V | Select-String '^Status:\s*(.+)$').Matches.Groups[1].Value.Trim()
            Write-Host "Task status: $state"

            if ($state -notmatch 'Running') {
              break
            }

            Start-Sleep -Seconds 10
            $elapsed += 10
          }

          if ($elapsed -ge $maxWaitSeconds) {
            throw "Deployment task timed out after $maxWaitSeconds seconds."
          }

      - name: Show deploy log
        shell: powershell
        run: |
          $logPath = 'C:\Users\dist6\reservio\.deploy-last.log'
          if (Test-Path $logPath) {
            Get-Content $logPath -Tail 200
          } else {
            Write-Host "Deploy log not found at $logPath"
          }
