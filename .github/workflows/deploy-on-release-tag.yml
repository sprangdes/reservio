name: Deploy on Release Tag

on:
  push:
    tags:
      - 'release-v*'

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy on Windows Runner
    runs-on: [self-hosted, windows, reservio-deploy]

    steps:
      - name: Deploy in local repo path (uses local .env)
        shell: powershell
        run: |
          $repoPath = 'C:\Users\dist6\reservio'
          if (!(Test-Path $repoPath)) {
            throw "Deploy path not found: $repoPath"
          }

          Set-Location $repoPath
          Write-Host "Deploying in: $(Get-Location)"

          git fetch --all --tags
          git checkout $env:GITHUB_REF_NAME
          git pull --ff-only origin $env:GITHUB_REF_NAME

          docker compose up -d --build --remove-orphans
          docker compose ps

      - name: Show recent backend/cloudflared logs
        shell: powershell
        run: |
          Set-Location 'C:\Users\dist6\reservio'
          docker compose logs --tail=120 backend cloudflared
