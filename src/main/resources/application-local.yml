spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reservio}
    username: ${SPRING_DATASOURCE_USERNAME:reservio}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  servlet:
    session:
      cookie:
        same-site: lax
        secure: false

app:
  line:
    login:
      channel-id: ${LINE_LOGIN_CHANNEL_ID}
      channel-secret: ${LINE_LOGIN_CHANNEL_SECRET}
      callback-base-url: http://localhost:8080
  auth:
    success-redirect-path: /login
    failure-redirect-path: /login
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
