spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/reservio
    username: postgres
    password:

server:
  servlet:
    session:
      cookie:
        same-site: lax
        secure: false

app:
  line:
    login:
      channel-id: ${LINE_LOGIN_CHANNEL_ID}
      channel-secret: ${LINE_LOGIN_CHANNEL_SECRET}
      callback-base-url: http://localhost:8080
  auth:
    success-redirect-path: /login
    failure-redirect-path: /login
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
