spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

app:
  line:
    login:
      channel-id: ${LINE_LOGIN_CHANNEL_ID}
      channel-secret: ${LINE_LOGIN_CHANNEL_SECRET}
      callback-base-url: https://www.reserv-io.com
  auth:
    success-redirect-path: https://www.reserv-io.com/login
    failure-redirect-path: https://www.reserv-io.com/login
  cors:
    allowed-origins: https://reserv-io.com,https://www.reserv-io.com
