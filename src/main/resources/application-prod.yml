spring:
  datasource:
    hikari:
      max-lifetime: 600000
      idle-timeout: 300000
      keepalive-time: 120000
      validation-timeout: 5000
      maximum-pool-size: 5
      minimum-idle: 1
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  line:
    login:
      channel-id: ${LINE_LOGIN_CHANNEL_ID}
      channel-secret: ${LINE_LOGIN_CHANNEL_SECRET}
      callback-base-url: https://www.reserv-io.com
    messaging:
      credential-encryption-key: ${LINE_CREDENTIAL_ENCRYPTION_KEY}
      webhook-base-url: ${LINE_WEBHOOK_BASE_URL:https://www.reserv-io.com}
      worker-delay-ms: ${LINE_WORKER_DELAY_MS:1000}
      rate-limit-per-minute: ${LINE_RATE_LIMIT_PER_MINUTE:20}
      rate-limit-window-seconds: ${LINE_RATE_LIMIT_WINDOW_SECONDS:60}
      event-retention-days: ${LINE_EVENT_RETENTION_DAYS:30}
      conversation-retention-days: ${LINE_CONVERSATION_RETENTION_DAYS:14}
      cleanup-cron: ${LINE_CLEANUP_CRON:0 30 3 * * *}
  auth:
    success-redirect-path: https://www.reserv-io.com/login
    failure-redirect-path: https://www.reserv-io.com/login
  cors:
    allowed-origins: https://reserv-io.com,https://www.reserv-io.com

logging:
  level:
    com.reservio.line: INFO
    org.springframework.security.web.csrf: WARN
    org.springframework.security.web.access: WARN
