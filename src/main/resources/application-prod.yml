spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      minimum-idle: 0
      maximum-pool-size: 5
      idle-timeout: 60000
      max-lifetime: 240000
      connection-timeout: 30000
      validation-timeout: 5000
      initialization-fail-timeout: 0
      data-source-properties:
        tcpKeepAlive: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  line:
    login:
      channel-id: ${LINE_LOGIN_CHANNEL_ID}
      channel-secret: ${LINE_LOGIN_CHANNEL_SECRET}
      callback-base-url: https://www.reserv-io.com
  auth:
    success-redirect-path: https://www.reserv-io.com/login
    failure-redirect-path: https://www.reserv-io.com/login
  cors:
    allowed-origins: https://reserv-io.com,https://www.reserv-io.com

logging:
  level:
    org.springframework.security.web.csrf: DEBUG
    org.springframework.security.web.access: DEBUG
