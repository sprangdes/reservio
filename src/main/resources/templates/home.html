<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservio - 您的專業預約管家</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light index-page">

    <!-- 傳入 navbarClass 參數讓導覽列變透明 -->
    <div th:replace="~{fragments/navbar :: navbar(navbarClass='navbar-transparent')}"></div>

    <main>
        <header class="hero-section text-center">
            <div class="container">
                <!-- 情況 A：訪客看到的是品牌介紹 -->
                <div sec:authorize="isAnonymous()">
                    <h1 class="display-3 fw-bold mb-4">歡迎來到 Reservio</h1>
                    <p class="lead mb-5">最直覺、最快速的預約系統，讓管理預約不再是難事。</p>
                    <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                        <a th:href="@{/register}" class="btn btn-light btn-lg px-4 gap-3 fw-bold text-primary">開始使用</a>
                        <a th:href="@{/login}" class="btn btn-outline-light btn-lg px-4">立即登入</a>
                    </div>
                </div>

                <!-- 情況 B：已登入使用者看到的是個人預約概況 -->
                <div sec:authorize="isAuthenticated()">
                    <h1 class="display-4 fw-bold mb-3">
                        你好，<span sec:authentication="name" class="text-warning">使用者</span>！
                    </h1>
                    <p class="lead mb-4">歡迎回來，今天想處理哪些預約服務呢？</p>
                    
                    <!-- 快速功能區 -->
                    <div class="row justify-content-center mt-4">
                        <div class="col-md-8">
                            <div class="card bg-white bg-opacity-10 border-0 shadow-lg text-white p-4" style="backdrop-filter: blur(10px);">
                                <div class="row align-items-center">
                                    <div class="col-sm-4 border-end border-white border-opacity-25">
                                        <h5 class="small text-uppercase opacity-75">今日預約</h5>
                                        <p class="h2 mb-0">0</p>
                                    </div>
                                    <div class="col-sm-4 border-end border-white border-opacity-25">
                                        <h5 class="small text-uppercase opacity-75">待處理事項</h5>
                                        <p class="h2 mb-0">3</p>
                                    </div>
                                    <div class="col-sm-4">
                                        <a th:href="@{/reservation/new}" class="btn btn-light fw-bold px-4">
                                            <i class="bi bi-plus-lg"></i> 新增預約
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- 特色介紹區 (可以選擇只給訪客看，或者全體可見) -->
        <section class="container my-5">
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card h-100 feature-card p-4">
                        <div class="card-body text-center">
                            <div class="display-6 text-primary mb-3">📅</div>
                            <h3 class="card-title h5 fw-bold">快速預約</h3>
                            <p class="card-text text-muted">只需幾秒鐘，即可完成繁瑣的預約流程，提升工作效率。</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card h-100 feature-card p-4">
                        <div class="card-body text-center">
                            <div class="display-6 text-success mb-3">🔔</div>
                            <h3 class="card-title h5 fw-bold">自動通知</h3>
                            <p class="card-text text-muted">系統自動發送提醒，降低爽約率，維持良好的服務品質。</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card h-100 feature-card p-4">
                        <div class="card-body text-center">
                            <div class="display-6 text-info mb-3">📊</div>
                            <h3 class="card-title h5 fw-bold">數據分析</h3>
                            <p class="card-text text-muted">掌握預約趨勢，透過報表優化您的業務資源分配。</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
