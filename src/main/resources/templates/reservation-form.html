<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增預約 - Reservio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main>
        <div class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-gradient text-white p-4 text-center">
                            <h4 class="mb-0 fw-bold"><i class="bi bi-calendar-plus"></i> 建立新預約</h4>
                            <p class="mb-0 mt-2 opacity-75">請填寫預約詳細資訊</p>
                        </div>
                        <div class="card-body p-4 p-lg-5">
                            <form th:action="@{/reservation/new}" method="post">
                                
                                <!-- 標題 -->
                                <div class="mb-4">
                                    <label for="title" class="form-label fw-bold">預約項目 / 標題</label>
                                    <input type="text" class="form-control" id="title" name="title" placeholder="例如：美髮預約、商務會議" required>
                                </div>

                                <div class="row">
                                    <!-- 日期 -->
                                    <div class="col-md-6 mb-4">
                                        <label for="reservationDate" class="form-label fw-bold">預約日期</label>
                                        <input type="date" class="form-control" id="reservationDate" name="reservationDate" required>
                                    </div>
                                    <!-- 狀態（預設） -->
                                    <div class="col-md-6 mb-4">
                                        <label class="form-label fw-bold">預約狀態</label>
                                        <input type="text" class="form-control bg-light" value="待確認 (PENDING)" readonly>
                                        <input type="hidden" name="status" value="PENDING">
                                    </div>
                                </div>

                                <div class="row">
                                    <!-- 開始時間 -->
                                    <div class="col-md-6 mb-4">
                                        <label for="startTime" class="form-label fw-bold">開始時間</label>
                                        <input type="time" class="form-control" id="startTime" name="startTime" required>
                                    </div>
                                    <!-- 結束時間 -->
                                    <div class="col-md-6 mb-4">
                                        <label for="endTime" class="form-label fw-bold">結束時間</label>
                                        <input type="time" class="form-control" id="endTime" name="endTime" required>
                                    </div>
                                </div>

                                <!-- 描述 -->
                                <div class="mb-4">
                                    <label for="description" class="form-label fw-bold">詳細描述</label>
                                    <textarea class="form-control" id="description" name="description" rows="3" placeholder="請輸入預約相關的詳細內容..."></textarea>
                                </div>

                                <!-- 備註 -->
                                <div class="mb-4">
                                    <label for="remark" class="form-label fw-bold">備註 (選填)</label>
                                    <input type="text" class="form-control" id="remark" name="remark" placeholder="是否有特殊要求？">
                                </div>

                                <hr class="my-4 opacity-25">

                                <div class="d-flex justify-content-between align-items-center">
                                    <a th:href="@{/}" class="text-muted text-decoration-none"><i class="bi bi-arrow-left"></i> 返回</a>
                                    <button type="submit" class="btn btn-gradient btn-lg px-5 fw-bold shadow-sm">送出預約</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
