<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增預約 - Reservio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main>
        <div class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-gradient text-white p-4 text-center">
                            <h4 class="mb-0 fw-bold"><i class="bi bi-calendar-plus"></i> 建立新預約</h4>
                            <p class="mb-0 mt-2 opacity-75">請填寫預約詳細資訊</p>
                        </div>
                        <div class="card-body p-4 p-lg-5">
                            <form th:action="@{/reservation/new}" method="post">
                                
                                <!-- 步驟 1：選擇預約項目 -->
                                <div class="mb-4">
                                    <h6 class="text-primary fw-bold mb-3"><i class="bi bi-1-circle-fill me-1"></i> 選擇預約項目</h6>
                                    <div class="mb-2">
                                        <label for="title" class="form-label small fw-semibold">預約服務項目</label>
                                        <select class="form-select form-select-sm" id="title" name="title" required>
                                            <option value="" disabled selected>請選擇您要預約的項目...</option>
                                            <option th:each="item : ${serviceItems}"
                                                    th:value="${item}"
                                                    th:text="${item}">項目名稱</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label for="description" class="form-label small fw-semibold">項目內容描述 (選填)</label>
                                        <textarea class="form-control form-control-sm" id="description" name="description" rows="2" placeholder="簡述您的預約需求..."></textarea>
                                    </div>
                                </div>

                                <!-- 步驟 2：選擇預約日期 -->
                                <div class="mb-4">
                                    <h6 class="text-primary fw-bold mb-3"><i class="bi bi-2-circle-fill me-1"></i> 選擇預約日期</h6>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <input type="date" class="form-control form-control-sm" id="reservationDate" name="reservationDate" required>
                                        </div>
                                    </div>
                                </div>

                                <!-- 步驟 3：選擇預約時間 -->
                                <div class="mb-4">
                                    <h6 class="text-primary fw-bold mb-3"><i class="bi bi-3-circle-fill me-1"></i> 選擇預約時間</h6>
                                    <div class="row g-2">
                                        <div class="col-md-6">
                                            <label for="startTime" class="form-label small fw-semibold">開始時間</label>
                                            <input type="time" class="form-control form-control-sm" id="startTime" name="startTime" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="endTime" class="form-label small fw-semibold">結束時間</label>
                                            <input type="time" class="form-control form-control-sm" id="endTime" name="endTime" required>
                                        </div>
                                    </div>
                                </div>

                                <!-- 步驟 4：其他備註 -->
                                <div class="mb-4">
                                    <h6 class="text-primary fw-bold mb-3"><i class="bi bi-4-circle-fill me-1"></i> 其他備註 (選填)</h6>
                                    <input type="text" class="form-control form-control-sm" id="remark" name="remark" placeholder="是否有其他特殊要求？">
                                    <input type="hidden" name="status" value="PENDING">
                                </div>

                                <hr class="my-4 opacity-25">

                                <div class="d-flex justify-content-between align-items-center">
                                    <a th:href="@{/}" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left"></i> 返回</a>
                                    <button type="submit" class="btn btn-gradient px-4 fw-bold shadow-sm">送出預約</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
