<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增預約 - Reservio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main>
        <div class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-gradient text-white p-4 text-center">
                            <h4 class="mb-0 fw-bold"><i class="bi bi-calendar-plus"></i> 建立新預約</h4>
                            <p class="mb-0 mt-2 opacity-75">請填寫預約詳細資訊</p>
                        </div>
                        <div class="card-body p-4 p-lg-5">
                            <form th:action="@{/reservation/new}" method="post">
                                
                                <!-- 步驟 1：選擇預約項目 -->
                                <div class="mb-4">
                                    <h6 class="text-primary fw-bold mb-3"><i class="bi bi-1-circle-fill me-1"></i> 選擇預約項目</h6>
                                    <div class="mb-2">
                                        <select class="form-select form-select-sm" id="title" name="title" required>
                                            <option value="" disabled selected>請選擇您要預約的項目...</option>
                                            <option th:each="item : ${serviceItems}"
                                                    th:value="${item.name}"
                                                    th:data-duration="${item.duration}"
                                                    th:text="${item.name + ' (' + item.duration + ' 分鐘)'}">項目名稱</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- 步驟 2：選擇預約日期 -->
                                <div class="mb-4">
                                    <h6 class="text-primary fw-bold mb-3"><i class="bi bi-2-circle-fill me-1"></i> 選擇預約日期</h6>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <input type="text" class="form-control form-control-sm bg-white" id="reservationDate" name="reservationDate" placeholder="請選擇日期.." required>
                                        </div>
                                    </div>
                                </div>

                                <!-- 步驟 3：選擇預約時間 -->
                                <div class="mb-4">
                                    <h6 class="text-primary fw-bold mb-3"><i class="bi bi-3-circle-fill me-1"></i> 選擇預約時間</h6>
                                        <div class="row">
                                            <div class="col-md-6">
                                                <!-- 初始狀態加上 disabled -->
                                                <select class="form-select form-select-sm" id="startTime" name="startTime" required disabled>
                                                    <option value="" disabled selected>請先選擇日期..</option>
                                                </select>
                                                <input type="hidden" id="endTime" name="endTime">
                                            </div>
                                        </div>
                                    </div>

                                    <!-- 步驟 4：其他備註 -->
                                    <div class="mb-4">
                                        <h6 class="text-primary fw-bold mb-3"><i class="bi bi-4-circle-fill me-1"></i> 其他備註 (選填)</h6>
                                        <textarea class="form-control form-control-sm" id="description" name="description" rows="2" placeholder="是否有其他特殊要求？"></textarea>
                                        <input type="hidden" name="status" value="PENDING">
                                    </div>

                                <hr class="my-4 opacity-25">

                                <div class="d-flex justify-content-between align-items-center">
                                    <a th:href="@{/}" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left"></i> 返回</a>
                                    <button type="submit" class="btn btn-gradient px-4 fw-bold shadow-sm">送出預約</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh-tw.js"></script>

    <script th:inline="javascript">
        const disableDates = /*[[${disabledDates}]]*/ [];

        const todat = new Date();
        const minDate = new Date(todat.getFullYear(), todat.getMonth(), todat.getDate()).toISOString().split('T')[0];
        const maxDate = new Date(todat.getFullYear(), todat.getMonth() + 3, todat.getDate()).toISOString().split('T')[0];

        const startSelect = document.getElementById('startTime');
        const endTimeHidden = document.getElementById('endTime');
        const titleSelect = document.getElementById('title');

        // 初始化 Flatpickr
        flatpickr("#reservationDate", {
            locale: "zh_tw",
            dateFormat: "Y-m-d",
            minDate: minDate,
            maxDate: maxDate,
            disable: disableDates,
            disableMobile: "true",
            // 核心控制邏輯：當日期改變時觸發
            onChange: function(selectedDates, dateStr) {
                if (dateStr) {
                    fetch(`/reservation/slots?date=${dateStr}`)
                        .then(response => response.json())
                        .then(slots => {
                            startSelect.innerHTML = '<option value="" disabled selected>請選擇時段...</option>';

                            if (slots.length > 0) {
                                slots.forEach(slot => {
                                    const option = document.createElement('option');
                                    option.value = slot;
                                    option.innerText = slot;
                                    startSelect.appendChild(option);
                                });
                                startSelect.disabled = false;
                                startSelect.classList.remove('bg-light');
                            } else {
                                startSelect.innerHTML = '<option value="" disabled selected>該日無可用時段</option>';
                                startSelect.disabled = true;
                            }
                            endTimeHidden.value = "";
                        })
                        .catch(error => {
                            console.error('Error fetching slots:', error);
                            startSelect.innerHTML = '<option value="" disabled selected>載入失敗</option>';
                        });
                } else {
                    startSelect.disabled = true;
                    startSelect.innerHTML = '<option value="" disabled selected>請先選擇日期..</option>';
                    startSelect.classList.add('bg-light');
                }
            }
        });

        // 自動計算結束時間的邏輯 calculateEndTime
        function calculateEndTime() {
            const selectedOption = titleSelect.options[titleSelect.selectedIndex];
            const startTime = startSelect.value;

            if (selectedOption && selectedOption.dataset.duration && startTime) {
                const duration = Number.parseInt(selectedOption.dataset.duration);
                const [hours, minutes] = startTime.split(':').map(Number);

                const date = new Date();
                date.setHours(hours, minutes + duration, 0);

                const endHours = String(date.getHours()).padStart(2, '0');
                const endMinutes = String(date.getMinutes()).padStart(2, '0');
                endTimeHidden.value = `${endHours}:${endMinutes}`;
            } else {
                endTimeHidden.value = "";
            }
        }

        // 綁定事件監聽器
        titleSelect.addEventListener('change', calculateEndTime);
        startSelect.addEventListener('change', calculateEndTime);
    </script>
</body>
</html>
