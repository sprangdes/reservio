<!--/* @thymesVar id="successMessage" type="java.lang.String" */-->
<!--/* @thymesVar id="errorMessage" type="java.lang.String" */-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>服務項目管理 - Reservio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar(navbarClass='', successMessage=${successMessage}, errorMessage=${errorMessage})}"></div>

    <main class="container my-5 pt-5">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-gradient text-white p-4 text-center">
                        <h5 class="mb-0 fw-bold"><i class="bi bi-plus-lg me-2"></i>新增服務項目</h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/service/add}" method="post">
                            <div class="mb-3">
                                <label for="name" class="form-label fw-bold small text-muted">服務名稱</label>
                                <input type="text" class="form-control border-light bg-light" id="name" name="name" placeholder="例如：精緻剪髮" required>
                            </div>
                            <div class="mb-4">
                                <label for="duration" class="form-label fw-bold small text-muted">服務時長 (分鐘)</label>
                                <div class="input-group">
                                    <input type="number" class="form-control border-light bg-light" id="duration" name="duration" min="5" step="5" placeholder="30" required>
                                    <span class="input-group-text border-light bg-light text-muted small">min</span>
                                </div>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-gradient fw-bold shadow-sm">確認新增</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm border-0 rounded-3 overflow-hidden">
                    <div class="card-header bg-white p-4 border-bottom d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-bold text-primary"><i class="bi bi-list-ul me-2"></i>目前的服務項目</h5>
                        <span class="badge bg-primary bg-opacity-10 text-primary px-3 rounded-pill" th:text="${#lists.size(services) + ' 個項目'}">0 個項目</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4 text-start" style="width: 50%">服務名稱</th>
                                        <th class="text-center" style="width: 25%">預估時長</th>
                                        <th class="text-center pe-4" style="width: 25%">管理</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="s : ${services}">
                                        <td class="ps-4 fw-bold text-dark" th:text="${s.name}">項目名稱</td>
                                        <td class="text-center">
                                            <span class="badge rounded-pill bg-light text-primary border border-primary border-opacity-25 px-3 py-2">
                                                <i class="bi bi-stopwatch me-1"></i> [[${s.duration}]] 分鐘
                                            </span>
                                        </td>
                                        <td class="text-center pe-4">
                                            <button class="btn btn-sm btn-link text-danger text-decoration-none" disabled>
                                                <i class="bi bi-trash3"></i> 移除
                                            </button>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(services)}">
                                        <td colspan="3" class="text-center text-muted py-5">
                                            <i class="bi bi-journal-x display-4 d-block mb-3 opacity-25"></i>
                                            尚未設定任何服務項目，請從左側新增
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4">
        <a th:href="@{/}" class="btn btn-light btn-sm text-primary fw-bold">
            <i class="bi bi-arrow-left me-1"></i> 返回儀表板
        </a>
    </div>
    </main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
