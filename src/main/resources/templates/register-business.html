<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家註冊 - Reservio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar(navbarClass='', successMessage=${successMessage}, errorMessage=${errorMessage})}"></div>

<main>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-gradient text-white p-4 text-center">
                        <h4 class="mb-0 fw-bold"><i class="bi bi-shop me-2"></i>成為 Reservio 合作商家</h4>
                        <p class="mb-0 mt-2 opacity-75">讓智慧預約助您的事業一臂之力</p>
                    </div>

                    <div class="card-body p-4">
                        <div th:if="${errorMessage}" class="alert alert-danger shadow-sm mb-4">
                            <i class="bi bi-exclamation-circle-fill me-2"></i>
                            <span th:text="${errorMessage}"></span>
                        </div>

                        <form th:action="@{/register/business}" method="post">
                            <h5 class="fw-bold mb-3 border-bottom pb-2">管理員資訊</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="username" class="form-label">管理員名稱</label>
                                    <input type="text" class="form-control" id="username" name="username" th:value="${username}" placeholder="登入帳號" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label">電子郵件</label>
                                    <input type="email" class="form-control" id="email" name="email" th:value="${email}" placeholder="聯絡用 Email" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label">設定管理密碼</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="請設定強固的密碼" required>
                            </div>

                            <h5 class="fw-bold mb-3 border-bottom pb-2">商家基本資料</h5>
                            <div class="mb-3">
                                <label for="businessName" class="form-label">商家名稱</label>
                                <input type="text" class="form-control" id="businessName" name="businessName" placeholder="例如： Reservio 咖啡館" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="category" class="form-label">服務類別</label>
                                    <select class="form-select" id="category" name="category" required>
                                        <option value="" selected disabled>請選擇</option>
                                        <option value="beauty">美容美髮</option>
                                        <option value="medical">診所醫療</option>
                                        <option value="restaurant">餐飲服務</option>
                                        <option value="other">其他諮詢</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="phone" class="form-label">商家電話</label>
                                    <input type="tel" class="form-control" id="phone" name="phone" placeholder="02-12345678" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="address" class="form-label">商家地址</label>
                                <input type="text" class="form-control" id="address" name="address" placeholder="請輸入完整服務地址" required>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-gradient btn-lg fw-bold shadow-sm">
                                    完成商家註冊並進入管理後台
                                </button>
                            </div>
                        </form>
                    </div>

                    <div class="card-footer text-center py-3">
                        <small class="text-muted">想改以客戶身份註冊？ <a th:href="@{/register}" class="text-primary text-decoration-none fw-bold">返回一般註冊</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
