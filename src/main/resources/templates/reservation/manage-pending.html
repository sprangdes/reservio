<!--/* @thymesVar id="successMessage" type="java.lang.String" */-->
<!--/* @thymesVar id="errorMessage" type="java.lang.String" */-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>待處理預約管理 - Reservio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar(navbarClass='', successMessage=${successMessage}, errorMessage=${errorMessage})}"></div>

<main class="container my-5 pt-5">
    <div class="card shadow-sm border-0 overflow-hidden">
        <div class="card-header bg-gradient text-white p-4">
            <div class="d-flex justify-content-between align-items-center">
                <h4 class="mb-0 fw-bold"><i class="bi bi-hourglass-split me-2"></i>待處理預約管理</h4>
                <span class="badge bg-white bg-opacity-25 fs-6 fw-normal">
                    <i class="bi bi-list-check me-1"></i> 共 [[${#lists.size(reservations)}]] 筆
                </span>
            </div>
        </div>

        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4 text-start" style="width: 14%">日期</th>
                        <th class="text-start" style="width: 12%">時間</th>
                        <th class="text-start" style="width: 14%">客戶名稱</th>
                        <th class="text-start" style="width: 16%">服務項目</th>
                        <th class="text-start" style="width: 24%">客戶備註</th>
                        <th class="text-center" style="width: 10%">狀態</th>
                        <th class="text-center pe-4" style="width: 10%">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="res : ${reservations}">
                        <td class="ps-4 text-start" th:text="${res.reservationDate}">2026-01-22</td>
                        <td class="text-start fw-bold text-primary" th:text="${res.startTime}">09:00</td>
                        <td class="text-start" th:text="${res.user.username}">客戶名稱</td>
                        <td class="text-start"><span class="text-dark" th:text="${res.title}">項目</span></td>
                        <td class="text-start">
                            <small class="text-muted text-break" th:text="${res.remark ?: '無備註'}"></small>
                        </td>
                        <td class="text-center">
                            <span class="badge rounded-pill bg-warning text-dark px-3">
                                <i class="bi bi-hourglass-split me-1"></i> 待確認
                            </span>
                        </td>
                        <td class="text-center pe-4">
                            <div class="btn-group">
                                <form th:action="@{/reservation/update-status}" method="post" class="d-inline">
                                    <input type="hidden" name="id" th:value="${res.id}">
                                    <input type="hidden" name="redirectTo" value="/reservation/pending/manage">
                                    <button type="submit" name="action" value="confirm" class="btn btn-sm btn-outline-success px-3">
                                        <i class="bi bi-check-lg"></i> 確認
                                    </button>
                                    <button type="submit" name="action" value="cancel" class="btn btn-sm btn-outline-danger px-3">
                                        <i class="bi bi-x-lg"></i> 取消
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(reservations)}">
                        <td colspan="7" class="text-center text-muted py-5">
                            <i class="bi bi-inbox display-4 d-block mb-3 opacity-25"></i>
                            目前沒有待處理預約
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card-footer bg-white py-3 border-top-0 ps-4">
            <a th:href="@{/}" class="btn btn-light btn-sm text-primary fw-bold">
                <i class="bi bi-arrow-left me-1"></i> 返回儀表板
            </a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
