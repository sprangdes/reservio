<!--/* @thymesVar id="successMessage" type="java.lang.String" */-->
<!--/* @thymesVar id="errorMessage" type="java.lang.String" */-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>我的預約 - Reservio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar(navbarClass='', successMessage=${successMessage}, errorMessage=${errorMessage})}"></div>

<main class="container my-5 pt-5">
    <div class="card shadow-sm border-0 overflow-hidden">
        <div class="card-header bg-gradient text-white p-4">
            <div class="d-flex justify-content-between align-items-center">
                <h4 class="mb-0 fw-bold"><i class="bi bi-person-check me-2"></i>我的預約</h4>
                <span class="badge bg-white bg-opacity-25 fs-6 fw-normal">
                    <i class="bi bi-list-check me-1"></i> 共 [[${#lists.size(reservations)}]] 筆
                </span>
            </div>
        </div>

        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4 text-start" style="width: 18%">店家</th>
                        <th class="text-start" style="width: 12%">日期</th>
                        <th class="text-start" style="width: 10%">時間</th>
                        <th class="text-start" style="width: 16%">服務項目</th>
                        <th class="text-center" style="width: 14%">狀態</th>
                        <th class="text-start" style="width: 20%">備註</th>
                        <th class="text-center pe-4" style="width: 10%">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="res : ${reservations}">
                        <td class="ps-4 text-start fw-bold" th:text="${res.business.name}">店家名稱</td>
                        <td class="text-start" th:text="${res.reservationDate}">2026-01-22</td>
                        <td class="text-start fw-bold text-primary" th:text="${res.startTime}">09:00</td>
                        <td class="text-start"><span class="text-dark" th:text="${res.title}">項目</span></td>

                        <td class="text-center">
                            <span th:if="${res.status.name() == 'PENDING'}" class="badge rounded-pill bg-warning text-dark px-3">
                                <i class="bi bi-hourglass-split me-1"></i> 待確認
                            </span>
                            <span th:if="${res.status.name() == 'CONFIRMED'}" class="badge rounded-pill bg-success px-3">
                                <i class="bi bi-check-circle me-1"></i> 已確認
                            </span>
                            <span th:if="${res.status.name() == 'CANCEL_REQUESTED'}" class="badge rounded-pill bg-secondary px-3">
                                <i class="bi bi-exclamation-circle me-1"></i> 取消確認中
                            </span>
                            <span th:if="${res.status.name() == 'CANCELLED'}" class="badge rounded-pill bg-secondary px-3">
                                <i class="bi bi-x-circle me-1"></i> 已取消
                            </span>
                            <span th:if="${res.status.name() == 'COMPLETED'}" class="badge rounded-pill bg-info px-3">
                                <i class="bi bi-flag me-1"></i> 已完成
                            </span>
                        </td>

                        <td class="text-start">
                            <small class="text-muted text-break" th:text="${res.remark ?: '無備註'}"></small>
                        </td>

                        <td class="text-center pe-4">
                            <!-- PENDING：直接取消 -->
                            <form th:if="${res.status.name() == 'PENDING'}" th:action="@{/my/reservations/cancel}" method="post" class="d-inline">
                                <input type="hidden" name="id" th:value="${res.id}">
                                <button type="submit" class="btn btn-sm btn-outline-danger px-3">
                                    <i class="bi bi-x-lg"></i> 取消
                                </button>
                            </form>

                            <!-- CONFIRMED：跳 modal 輸入原因 -->
                            <button th:if="${res.status.name() == 'CONFIRMED'}"
                                    type="button"
                                    class="btn btn-sm btn-outline-danger px-3"
                                    data-bs-toggle="modal"
                                    data-bs-target="#cancelModal"
                                    th:attr="data-reservation-id=${res.id}">
                                <i class="bi bi-x-lg"></i> 取消
                            </button>

                            <!-- 其他狀態：不可操作 -->
                            <small th:unless="${res.status.name() == 'PENDING' || res.status.name() == 'CONFIRMED'}" class="text-muted">
                                -
                            </small>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(reservations)}">
                        <td colspan="7" class="text-center text-muted py-5">
                            <i class="bi bi-inbox display-4 d-block mb-3 opacity-25"></i>
                            目前尚無預約資料
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card-footer bg-white py-3 border-top-0 ps-4">
            <a th:href="@{/}" class="btn btn-light btn-sm text-primary fw-bold">
                <i class="bi bi-arrow-left me-1"></i> 返回儀表板
            </a>
        </div>
    </div>
</main>

<!-- 取消原因 Modal（共用一個即可） -->
<div class="modal fade" id="cancelModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <form th:action="@{/my/reservations/cancel}" method="post" class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">取消預約</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="cancelReservationId" name="id">
                <div class="mb-3">
                    <label for="cancelReason" class="form-label">取消原因</label>
                    <textarea id="cancelReason" name="cancelReason" class="form-control" rows="3" placeholder="請輸入取消原因" required></textarea>
                    <div class="form-text text-muted">此取消將送交店家確認。</div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">返回</button>
                <button type="submit" class="btn btn-danger fw-bold">確認送出</button>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        const modal = document.getElementById('cancelModal');
        if (!modal) return;

        modal.addEventListener('show.bs.modal', function (event) {
            const button = event.relatedTarget;
            const reservationId = button?.getAttribute('data-reservation-id');
            document.getElementById('cancelReservationId').value = reservationId || '';
            document.getElementById('cancelReason').value = '';
        });
    });
</script>
</body>
</html>
