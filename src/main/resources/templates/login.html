<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - Reservio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main>
        <div class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card shadow-sm border-0">
                        <!-- 使用與 Hero Section 一致的漸層標題 -->
                        <div class="card-header bg-gradient text-white p-4 text-center">
                            <h4 class="mb-0 fw-bold">歡迎回來</h4>
                            <p class="mb-0 mt-2 opacity-75">登入以管理您的預約服務</p>
                        </div>

                        <div class="card-body p-4">
                            <!-- 顯示註冊成功的訊息 -->
                            <div th:if="${successMessage}" class="alert alert-success shadow-sm mb-4">
                                <span th:text="${successMessage}"></span>
                            </div>

                            <!-- 登入錯誤訊息提示 -->
                            <div th:if="${param.error}" class="alert alert-danger shadow-sm">
                                使用者名稱或密碼不正確，請再試一次。
                            </div>

                            <!-- 登出成功訊息提示 -->
                            <div th:if="${param.logout}" class="alert alert-success shadow-sm">
                                您已成功登出。
                            </div>

                            <form th:action="@{/login}" method="post">
                                <div class="mb-3">
                                    <label for="username" class="form-label">使用者名稱 / 電子郵件</label>
                                    <input type="text" class="form-control" id="username" name="username" placeholder="請輸入帳號" required autofocus>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">密碼</label>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="請輸入密碼" required>
                                </div>
                                <div class="d-grid mt-4">
                                    <button type="submit" class="btn btn-gradient btn-lg fw-bold shadow-sm">登入系統</button>
                                </div>
                            </form>
                        </div>

                        <div class="card-footer text-center py-3">
                            <small class="text-muted">還沒有帳號嗎？ <a th:href="@{/register}" class="text-primary text-decoration-none fw-bold">立即註冊</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
