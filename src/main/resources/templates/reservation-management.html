<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>今日預約管理 - Reservio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar(navbarClass='', successMessage=${successMessage}, errorMessage=${errorMessage})}"></div>
<main class="container my-5 pt-5">
        <div class="card shadow-sm border-0 overflow-hidden">
            <!-- 改用系統一致的漸層標題 -->
            <div class="card-header bg-gradient text-white p-4">
                <div class="d-flex justify-content-between align-items-center">
                    <h4 class="mb-0 fw-bold"><i class="bi bi-calendar-check me-2"></i>今日預約管理</h4>
                    <span class="badge bg-white bg-opacity-25 fs-6 fw-normal">
                        <i class="bi bi-clock me-1"></i> [[${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}]]
                    </span>
                </div>
            </div>
            
            <div class="card-body p-0"> <!-- 移除內距讓表格填滿 -->
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">時間</th>
                                <th>客戶名稱</th>
                                <th>服務項目</th>
                                <th>預約狀態</th>
                                <th class="text-center pe-4">操作管理</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="res : ${reservations}">
                                <td class="ps-4 fw-bold text-primary" th:text="${res.startTime}">09:00</td>
                                <td th:text="${res.user.username}">客戶名稱</td>
                                <td>
                                    <span class="text-dark" th:text="${res.title}">項目</span>
                                </td>
                                <td>
                                    <!-- 狀態標籤美化 -->
                                    <span th:if="${res.status.name() == 'PENDING'}" class="badge rounded-pill bg-warning text-dark px-3">
                                        <i class="bi bi-hourglass-split me-1"></i> 待確認
                                    </span>
                                    <span th:if="${res.status.name() == 'CONFIRMED'}" class="badge rounded-pill bg-success px-3">
                                        <i class="bi bi-check-circle me-1"></i> 已核准
                                    </span>
                                </td>
                                <td class="text-center pe-4">
                                    <div class="btn-group">
                                        <button class="btn btn-sm btn-outline-success px-3">
                                            <i class="bi bi-check-lg"></i> 核准
                                        </button>
                                        <button class="btn btn-sm btn-outline-danger px-3">
                                            <i class="bi bi-x-lg"></i> 取消
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <!-- 無資料時顯示 -->
                            <tr th:if="${#lists.isEmpty(reservations)}">
                                <td colspan="5" class="text-center text-muted py-5">
                                    <i class="bi bi-inbox display-4 d-block mb-3 opacity-25"></i>
                                    目前尚無今日預約資料
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="card-footer bg-white py-3 border-top-0 ps-4">
                <a th:href="@{/}" class="btn btn-light btn-sm text-primary fw-bold">
                    <i class="bi bi-arrow-left me-1"></i> 返回儀表板
                </a>
            </div>
        </div>
    </main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
