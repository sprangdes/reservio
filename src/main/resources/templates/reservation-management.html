<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>今日預約管理 - Reservio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar(navbarClass='', successMessage=${successMessage}, errorMessage=${errorMessage})}"></div>
<main class="container my-5 pt-5">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white p-3">
            <h5 class="mb-0 fw-bold">今日預約清單 ([[${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}]])</h5>
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>時間</th>
                    <th>客戶名稱</th>
                    <th>服務項目</th>
                    <th>狀態</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="res : ${reservations}">
                    <td th:text="${res.startTime}">09:00</td>
                    <td th:text="${res.user.username}">客戶名稱</td>
                    <td th:text="${res.title}">項目</td>
                    <td>
                                <span th:classappend="${res.status.name() == 'PENDING' ? 'badge bg-warning' : 'badge bg-success'}"
                                      th:text="${res.status}">狀態</span>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary">核准</button>
                        <button class="btn btn-sm btn-outline-danger">取消</button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(reservations)}">
                    <td colspan="5" class="text-center text-muted py-4">今日尚無預約資料</td>
                </tr>
                </tbody>
            </table>
            <div class="mt-3">
                <a th:href="@{/}" class="btn btn-secondary btn-sm">返回儀表板</a>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
