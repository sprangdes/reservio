spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      client:
        provider:
          line:
            authorization-uri: https://access.line.me/oauth2/v2.1/authorize
            token-uri: https://api.line.me/oauth2/v2.1/token
            user-info-uri: https://api.line.me/v2/profile
            user-name-attribute: userId
        registration:
          line-user:
            provider: line
            client-id: ${LINE_LOGIN_CHANNEL_ID}
            client-secret: ${LINE_LOGIN_CHANNEL_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: ${LINE_LOGIN_CALLBACK_BASE_URL:{baseUrl}}/login/oauth2/code/{registrationId}
            scope:
              - profile
          line-business:
            provider: line
            client-id: ${LINE_LOGIN_CHANNEL_ID}
            client-secret: ${LINE_LOGIN_CHANNEL_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: ${LINE_LOGIN_CALLBACK_BASE_URL:{baseUrl}}/login/oauth2/code/{registrationId}
            scope:
              - profile

logging:
  level:
    org.hibernate: ERROR
    org.hibernate.type.descriptor.sql.BasicBinder: ERROR

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 5m
      cookie:
        same-site: none
        secure: true
        max-age: 5m

business:
  category: "美容美髮,診所醫療,餐飲服務,其他諮詢"

otp:
  expire-minute: 10
  max-attempts: 5

app:
  auth:
    success-redirect-path: /login
    failure-redirect-path: /login
